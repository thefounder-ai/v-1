<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SkillOrbit turns your learning activity into a clear next step for your career."
    />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <title>{{ page_title }} · SkillOrbit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="{% block body_class %}{% endblock %}" data-authenticated="{{ 'true' if user else 'false' }}">
    {% block content %}{% endblock %}
    <script src="/static/ui.js" defer></script>
    <script src="/static/app.js" defer></script>
    <script src="/static/tracking.js" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
